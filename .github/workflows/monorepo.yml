name: VM2 Scope Self-Config CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  detect-scopes:
    name: VM2 Detect Scopes
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ fromJSON(steps.scopes.outputs.scopes).backend }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect scopes with official Mergify action
        id: scopes
        uses: Mergifyio/gha-mergify-ci@v25
        with:
          action: scopes
          mergify_cli_version: 2026.9.16.1

      - name: Show trusted decision
        env:
          RAW: ${{ steps.scopes.outputs.scopes }}
          BACKEND: ${{ fromJSON(steps.scopes.outputs.scopes).backend }}
        run: |
          echo "VM2_SCOPES_JSON=$RAW"
          echo "VM2_BACKEND_SCOPE=$BACKEND"

  backend-tests:
    name: VM2 Backend Tests
    needs: detect-scopes
    if: ${{ needs.detect-scopes.outputs.backend == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Deterministic backend regression guard
        run: |
          echo "VM2_BACKEND_TEST_RAN=yes"
          if grep -q '^BROKEN$' src/security.txt; then
            echo "VM2_BACKEND_TEST_RESULT=FAIL"
            exit 1
          fi
          echo "VM2_BACKEND_TEST_RESULT=PASS"

  ci-gate:
    name: VM2 Scope CI Gate
    if: ${{ !cancelled() }}
    needs:
      - detect-scopes
      - backend-tests
    runs-on: ubuntu-24.04
    steps:
      - name: Aggregate with official Mergify wait-jobs
        uses: Mergifyio/gha-mergify-ci@v25
        with:
          action: wait-jobs
          jobs: ${{ toJSON(needs) }}
          mergify_cli_version: 2026.9.16.1
